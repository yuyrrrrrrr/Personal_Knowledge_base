\x22commandMetadata\x22:\x7b\x22webCommandMetadata\x22:\x7b\x22url\x22:\x22\/@AndrejKarpathy\x22,\x22webPageType\x22:\x22WEB_PAGE_TYPE_CHANNEL\x22,\x22rootVe\x22:3611,\x22apiUrl\x22:\x22\/youtubei\/v1\/browse\x22\x7d\x7d,\x22browseEndpoint\x22:\x7b\x22browseId\x22:\x22UCXUPKJO5MZQN11PqgIvyuvQ\x22,\x22canonicalBaseUrl\x22:\x22\/@AndrejKarpathy\x22\x7d\x7d,\x22channelThumbnail\x22:\x7b\x22thumbnails\x22:\x5b\x7b\x22url\x22:\x22https:\/\/yt3.ggpht.com\/ytc\/AIdro_nDvyq2NoPL626bk1IbxQ94SfQsD-B0qgZchghtQNkLWoEz\x3ds88-c-k-c0x00ffffff-no-rj\x22\x7d\x5d\x7d\x7d\x7d,\x7b\x22expandableVideoDescriptionBodyRenderer\x22:\x7b\x22showMoreText\x22:\x7b\x22runs\x22:\x5b\x7b\x22text\x22:\x22...更多\x22\x7d\x5d,\x22accessibility\x22:\x7b\x22accessibilityData\x22:\x7b\x22label\x22:\x22顯示更多\x22\x7d\x7d\x7d,\x22showLessText\x22:\x7b\x22runs\x22:\x5b\x7b\x22text\x22:\x22顯示較少\x22\x7d\x5d\x7d,\x22attributedDescriptionBodyText\x22:\x7b\x22content\x22:\x22This is a 1 hour general-audience introduction to Large Language Models: the core technical component behind systems like ChatGPT, Claude, and Bard. What they are, where they are headed, comparisons and analogies to present-day operating systems, and some of the security-related challenges of this new computing paradigm.\\nAs of November 2023 (this field moves fast!).\\n\\nContext: This video is based on the slides of a talk I gave recently at the AI Security Summit. The talk was not recorded but a lot of people came to me after and told me they liked it. Seeing as I had already put in one long weekend of work to make the slides, I decided to just tune them a bit, record this round 2 of the talk and upload it here on YouTube. Pardon the random background, that\x27s my hotel room during the thanksgiving break.\\n\\nSlides as PDF: https:\/\/drive.google.c... (42MB)\\nSlides. as Keynote: https:\/\/drive.google.c... (140MB)\\n\\nFew things I wish I said (I\x27ll add items here as they come up):\\nThe dreams and hallucinations do not get fixed with finetuning. Finetuning just \\\x22directs\\\x22 the dreams into \\\x22helpful assistant dreams\\\x22. Always be careful with what LLMs tell you, especially if they are telling you something from memory alone. That said, similar to a human, if the LLM used browsing or retrieval and the answer made its way into the \\\x22working memory\\\x22 of its context window, you can trust the LLM a bit more to process that information into the final answer. But TLDR right now, do not trust what LLMs say or do. For example, in the tools section, I\x27d always recommend double-checking the math\/code the LLM did.\\nHow does the LLM use a tool like the browser? It emits special words, e.g. |BROWSER|. When the code \\\x22above\\\x22 that is inferencing the LLM detects these words it captures the output that follows, sends it off to a tool, comes back with the result and continues the generation. How does the LLM know to emit these special words? Finetuning datasets teach it how and when to browse, by example. And\/or the instructions for tool use can also be automatically placed in the context window (in the “system message”).\\nYou might also enjoy my 2015 blog post \\\x22Unreasonable Effectiveness of Recurrent Neural Networks\\\x22. The way we obtain base models today is pretty much identical on a high level, except the RNN is swapped for a Transformer. http:\/\/karpathy.github...\\nWhat is in the run.c file? A bit more full-featured 1000-line version hre: https:\/\/github.com\/kar...\\n\\nChapters:\\nPart 1: LLMs\\n00:00:00 Intro: Large Language Model (LLM) talk\\n00:00:20 LLM Inference\\n00:04:17 LLM Training\\n00:08:58 LLM dreams\\n00:11:22 How do they work?\\n00:14:14 Finetuning into an Assistant\\n00:17:52 Summary so far\\n00:21:05 Appendix: Comparisons, Labeling docs, RLHF, Synthetic data, Leaderboard\\nPart 2: Future of LLMs\\n00:25:43 LLM Scaling Laws\\n00:27:43 Tool Use (Browser, Calculator, Interpreter, DALL-E)\\n00:33:32 Multimodality (Vision, Audio)\\n00:35:00 Thinki _STYLE_COLOR_SAMPLED_ADDITIVE\x22,\x22lightThemeColorPalette\x22:\x7b\x22baseBackground\x22:4293983231,\x22raisedBackground\x22:4293983231,\x22additiveBackground\x22:558212041,\x22textPrimary\x22:4278855990,\x22textSecondary\x22:4281884785,\x22invertedBackground\x22:4279856272,\x22overlayBackground\x22:3423217974\x7d,\x22darkThemeColorPalette\x22:\x7b\x22baseBackground\x22:4278326556,\x22raisedBackground\x22:4278855990,\x22additiveBackground\x22:725984201,\x22textPrimary\x22:4292932602,\x22textSecondary\x22:4289449950,\x22invertedBackground\x22:4286432739,\x22overlayBackground\x22:3423217974\x7d,\x22colorSampledDescriptionBodyText\x22:\x7b\x22content\x22:\x22This is a 1 hour general-audience introduction to Large Language Models: the core technical component behind systems like ChatGPT, Claude, and Bard. What they are, where they are headed, comparisons and analogies to present-day operating systems, and some of the security-related challenges of this new computing paradigm.\\nAs of November 2023 (this field moves fast!).\\n\\nContext: This video is based on the slides of a talk I gave recently at the AI Security Summit. The talk was not recorded but a lot of people came to me after and told me they liked it. Seeing as I had already put in one long weekend of work to make the slides, I decided to just tune them a bit, record this round 2 of the talk and upload it here on YouTube. Pardon the random background, that\x27s my hotel room during the thanksgiving break.\\n\\nSlides as PDF: https:\/\/drive.google.c... (42MB)\\nSlides. as Keynote: https:\/\/drive.google.c... (140MB)\\n\\nFew things I wish I said (I\x27ll add items here as they come up):\\nThe dreams and hallucinations do not get fixed with finetuning. Finetuning just \\\x22directs\\\x22 the dreams into \\\x22helpful assistant dreams\\\x22. Always be careful with what LLMs tell you, especially if they are telling you something from memory alone. That said, similar to a human, if the LLM used browsing or retrieval and the answer made its way into the \\\x22working memory\\\x22 of its context window, you can trust the LLM a bit more to process that information into the final answer. But TLDR right now, do not trust what LLMs say or do. For example, in the tools section, I\x27d always recommend double-checking the math\/code the LLM did.\\nHow does the LLM use a tool like the browser? It emits special words, e.g. |BROWSER|. When the code \\\x22above\\\x22 that is inferencing the LLM detects these words it captures the output that follows, sends it off to a tool, comes back with the result and continues the generation. How does the LLM know to emit these special words? Finetuning datasets teach it how and when to browse, by example. And\/or the instructions for tool use can also be automatically placed in the context window (in the “system message”).\\nYou might also enjoy my 2015 blog post \\\x22Unreasonable Effectiveness of Recurrent Neural Networks\\\x22. The way we obtain base models today is pretty much identical on a high level, except the RNN is swapped for a Transformer. http:\/\/karpathy.github...\\nWhat is in the run.c file? A bit more full-featured 1000-line version hre: https:\/\/github.com\/kar...\\n\\nChapters:\\nPart 1: LLMs\\n00:00:00 Intro: Large Language Model (LLM) talk\\n00:00:20 LLM Inference\\n00:04:17 LLM Training\\n00:08:58 LLM dreams\\n00:11:22 How do they work?\\n00:14:14 Finetuning into an Assistant\\n00:17:52 Summary so far\\n00:21:05 Appendix: Comparisons, Labeling docs, RLHF, Synthetic data, Leaderboard\\nPart 2: Future of LLMs\\n00:25:43 LLM Scaling Laws\\n00:27:43 Tool Use (Browser, Calculator, Interpreter, DALL-E)\\n00:33:32 Multimodality (Vision, Audio)\\n00:35:00 Thinking, System 1\/2\\n00:38:02 Self-improvement, LLM AlphaGo\\n00:40:45 LLM Customization, GPTs store\\n00:42:15 LLM OS\\nPart 3: LLM Security\\n00:45:43 LLM Security Intro\\n00:46:14 Jailbreaks\\n00:51:30 Prompt Injection\\n00:56:23 Data poisoning\\n00:58:37 LLM Security conclusions\\nEnd\\n00:59:23 Outro\\n\\nEducational Use Licensing\\nThis video is freely available for educational and internal training purposes. Educators, students, schools, universities, nonprofit institutions, businesses, and individual learners may use this content freely for lessons, courses, internal training, and learning activities, provided they do not engage in commercial resale, redistribution, external commercial use, or modify content to misrepresent its intent.\x22,\x22commandRuns\x22:\x5b\x7b\x22startIndex\x22:828,\x22length\x22:25,\x22onTap\x22:\x7b\x22innertubeCommand\x22:\x7b\x22clickTrackingParams\x22:\x22CAcQ040EGAQiEwjAvMXx_MCXAxWI80wCHW4QBN5I-J-2woWmwJzOAcoBBLyn0dQ\x3d\x22,\x22commandMetadata\x22:\x7b\x22webCommandMetadata\x22:\x7b\x22url\x22:\x22https:\/\/www.youtube.com\/redirect?event\x3dvideo_description\\u0026redir_token\x3dQUZZTVljRnlHMnJIN1hsaGx3bzc4YXFjX3F6Q3xBSTVJdTVzcFlYdERTZkpIRVRGek1QMkR5eTBfSVR4SzJqaWVpT3A1LTR5QzVuNy1vT3dkbDRQTWRhay1XaFQ0V085MTJBT1BwZkctYUUxU1gwbDB2WlZLeE5XUXllMEJIYXh6\\u0026q\x3dhttps%3A%2F%2Fdrive.google.com%2Ffile%2Fd%2F1pxx_ZI7O-Nwl7ZLNk5hI3WzAsTLwvNU7%2Fview%3Fusp%3Dshare_link\\u0026v\x3dzjkBMFhNj_g\x22,\x22webPageType\x22:\x22WEB_PAGE_TYPE_UNKNOWN\x22,\x22rootVe\x22:83769\x7d\x7d,\x22urlEndpoint\x22:\x7b\x22url\x22:\x22https:\/\/www.youtube.com\/redirect?event\x3dvideo_description\\u0026redir_token\x3dQUZZTVljRnlHMnJIN1hsaGx3bzc4YXFjX3F6Q3xBSTVJdTVzcFlYdERTZkpIRVRGek1QMkR5eTBfSVR4SzJqaWVpT3A1LTR5QzVuNy1vT3dkbDRQTWRhay1XaFQ0V085MTJBT1BwZkctYUUxU1gwbDB2WlZLeE5XUXllMEJIYXh6\\u0026q\x3dhttps%3A%2F%2Fdrive.google.com%2Ffile%2Fd%2F1pxx_ZI7O-Nwl7ZLNk5hI3WzAsTLwvNU7%2Fview%3Fusp%3Dshare_link\\u0026v\x3dzjkBMFhNj_g\x22,\x22target\x22:\x22TARGET_NEW_WINDOW\x22,\x22nofollow\x22:true\x7d\x7d\x7d\x7d,\x7b\x22startIndex\x22:881,\x22length\x22:25,\x22onTap\x22:\x7b\x22innertubeCommand\x22:\x7b\x22clickTrackingParams\x22:\x22CAcQ040EGAQiEwjAvMXx_MCXAxWI80wCHW4QBN5I-J-2woWmwJzOAcoBBLyn0dQ\x3d\x22,\x22commandMetadata\x22:\x7b\x22w Context: This video is based on the slides of a talk I gave recently at the AI Security Summit. The talk was not recorded but a lot of people came to me after and told me they liked it. Seeing as I had already put in one long weekend of work to make the slides, I decided to just tune them a bit, record this round 2 of the talk and upload it here on YouTube. Pardon the random background, that&#39;s my hotel room during the thanksgiving break.

- Slides as PDF: https://drive.google.com/file/d/1pxx_ZI7O-Nwl7ZLNk5hI3WzAsTLwvNU7/view?usp=share_link (42MB)
- Slides. as Keynote: https://drive.google.com/file/d/1FPUpFMiCkMRKPFjhi9MAhby68MHVqe8u/view?usp=share_link (140MB)

Few things I wish I said (I&#39;ll add items here as they come up):
- The dreams and hallucinations do not get fixed with finetuning. Finetuning just &quot;directs&quot; the dreams into &quot;helpful assistant dreams&quot;. Always be careful with what LLMs tell you, especially if they are telling you something from memory alone. That said, similar to a human, if the LLM used browsing or retrieval and the answer made its way into the &quot;working memory&quot; of its context window, you can trust the LLM a bit more to process that information into the final answer. But TLDR right now, do not trust what LLMs say or do. For example, in the tools section, I&#39;d always recommend double-checking the math/code the LLM did.
- How does the LLM use a tool like the browser? It emits special words, e.g. |BROWSER|. When the code &quot;above&quot; that is inferencing the LLM detects these words it captures the output that follows, sends it off to a tool, comes back with the result and continues the generation. How does the LLM know to emit these special words? Finetuning datasets teach it how and when to browse, by example. And/or the instructions for tool use can also be automatically placed in the context window (in the “system message”).
- You might also enjoy my 2015 blog post &quot;Unreasonable Effectiveness of Recurrent Neural Networks&quot;. The way we obtain base models today is pretty much identical on a high level, except the RNN is swapped for a Transformer. http://karpathy.github.io/2015/05/21/rnn-effectiveness/
- What is in the run.c file? A bit more full-featured 1000-line version hre: https://github.com/karpathy/llama2.c/blob/master/run.c

Context: This video is based on the slides of a talk I gave recently at the AI Security Summit. The talk was not recorded but a lot of people came to me after and told me they liked it. Seeing as I had already put in one long weekend of work to make the slides, I decided to just tune them a bit, record this round 2 of the talk and upload it here on YouTube. Pardon the random background, that&#39;s my hotel room during the thanksgiving break.

- Slides as PDF: https://drive.google.com/file/d/1pxx_ZI7O-Nwl7ZLNk5hI3WzAsTLwvNU7/view?usp=share_link (42MB)

Few things I wish I said (I&#39;ll add items here as they come up):
- The dreams and hallucinations do not get fixed with finetuning. Finetuning just &quot;directs&quot; the dreams into &quot;helpful assistant dreams&quot;. Always be careful with what LLMs tell you, especially if they are telling you something from memory alone. That said, similar to a human, if the LLM used browsing or retrieval and the answer made its way into the &quot;working memory&quot; of its context window, you can trust the LLM a bit more to process that information into the final answer. But TLDR right now, do not trust what LLMs say or do. For example, in the tools section, I&#39;d always recommend double-checking the math/code the LLM did.
- How does the LLM use a tool like the browser? It emits special words, e.g. |BROWSER|. When the code &quot;above&quot; that is inferencing the LLM detects these words it captures the output that follows, sends it off to a tool, comes back with the result and continues the generation. How does the LLM know to emit these special words? Finetuning datasets teach it how and when to browse, by example. And/or the instructions for tool use can also be automatically placed in the context window (in the “system message”).
- You might also enjoy my 2015 blog post &quot;Unreasonable Effectiveness of Recurrent Neural Networks&quot;. The way we obtain base models today is pretty much identical on a high level, except the RNN is swapped for a Transformer. http://karpathy.github.io/2015/05/21/rnn-effectiveness/
- What is in the run.c file? A bit more full-featured 1000-line version hre: https://github.com/karpathy/llama2.c/blob/master/run.c

ode":"tum","languageName":{"runs":[{"text":"圖姆布卡文"}]}},{"languageCode":"ug","languageName":{"runs":[{"text":"維吾爾文"}]}},{"languageCode":"mn","languageName":{"runs":[{"text":"蒙古文"}]}},{"languageCode":"qu","languageName":{"runs":[{"text":"蓋楚瓦文"}]}},{"languageCode":"ha","languageName":{"runs":[{"text":"豪薩文"}]}},{"languageCode":"de","languageName":{"runs":[{"text":"德文"}]}},{"languageCode":"pam","languageName":{"runs":[{"text":"潘帕嘉文"}]}},{"languageCode":"my","languageName":{"runs":[{"text":"緬甸文"}]}},{"languageCode":"lua","languageName":{"runs":[{"text":"魯巴魯魯亞文"}]}},{"languageCode":"rw","languageName":{"runs":[{"text":"盧旺達文"}]}},{"languageCode":"lb","languageName":{"runs":[{"text":"盧森堡文"}]}},{"languageCode":"luo","languageName":{"runs":[{"text":"盧歐文"}]}},{"languageCode":"ko","languageName":{"runs":[{"text":"韓文"}]}},{"languageCode":"sm","languageName":{"runs":[{"text":"薩摩亞文"}]}},{"languageCode":"bo","languageName":{"runs":[{"text":"藏文"}]}},{"languageCode":"ro","languageName":{"runs":[{"text":"羅馬尼亞文"}]}},{"languageCode":"gd","languageName":{"runs":[{"text":"蘇格蘭蓋爾文"}]}},{"languageCode":"tt","languageName":{"runs":[{"text":"韃靼文"}]}}],"defaultAudioTrackIndex":0}},"videoDetails":{"videoId":"zjkBMFhNj_g","title":"[1hr Talk] Intro to Large Language Models","lengthSeconds":"3588","channelId":"UCXUPKJO5MZQN11PqgIvyuvQ","isOwnerViewing":false,"shortDescription":"This is a 1 hour general-audience introduction to Large Language Models: the core technical component behind systems like ChatGPT, Claude, and Bard. What they are, where they are headed, comparisons and analogies to present-day operating systems, and some of the security-related challenges of this new computing paradigm.\nAs of November 2023 (this field moves fast!).\n\nContext: This video is based on the slides of a talk I gave recently at the AI Security Summit. The talk was not recorded but a lot of people came to me after and told me they liked it. Seeing as I had already put in one long weekend of work to make the slides, I decided to just tune them a bit, record this round 2 of the talk and upload it here on YouTube. Pardon the random background, that's my hotel room during the thanksgiving break.\n\n- Slides as PDF: https://drive.google.com/file/d/1pxx_ZI7O-Nwl7ZLNk5hI3WzAsTLwvNU7/view?usp=share_link (42MB)\n- Slides. as Keynote: https://drive.google.com/file/d/1FPUpFMiCkMRKPFjhi9MAhby68MHVqe8u/view?usp=share_link (140MB)\n\nFew things I wish I said (I'll add items here as they come up):\n- The dreams and hallucinations do not get fixed with finetuning. Finetuning just \"directs\" the dreams into \"helpful assistant dreams\". Always be careful with what LLMs tell you, especially if they are telling you something from memory alone. That said, similar to a human, if the LLM used browsing or retrieval and the answer made its way into the \"working memory\" of its context window, you can trust the LLM a bit more to process that information into the final answer. But TLDR right now, do not trust what LLMs say or do. For example, in the tools section, I'd always recommend double-checking the math/code the LLM did.\n- How does the LLM use a tool like the browser? It emits special words, e.g. |BROWSER|. When the code \"above\" that is inferencing the LLM detects these words it captures the output that follows, sends it off to a tool, comes back with the result and continues the generation. How does the LLM know to emit these special words? Finetuning datasets teach it how and when to browse, by example. And/or the instructions for tool use can also be automatically placed in the context window (in the “system message”).\n- You might also enjoy my 2015 blog post \"Unreasonable Effectiveness of Recurrent Neural Networks\". The way we obtain base models today is pretty much identical on a high level, except the RNN is swapped for a Transformer. http://karpathy.github.io/2015/05/21/rnn-effectiveness/\n- What is in the run.c file? A bit more full-featured 1000-line version hre: https://github.com/karpathy/llama2.c/blob/master/run.c\n\nChapters:\nPart 1: LLMs\n00:00:00 Intro: Large Language Model (LLM) talk\n00:00:20 LLM Inference\n00:04:17 LLM Training\n00:08:58 LLM dreams\n00:11:22 How do they work?\n00:14:14 Finetuning into an Assistant\n00:17:52 Summary so far\n00:21:05 Appendix: Comparisons, Labeling docs, RLHF, Synthetic data, Leaderboard\nPart 2: Future of LLMs\n00:25:43 LLM Scaling Laws\n00:27:43 Tool Use (Browser, Calculator, Interpreter, DALL-E)\n00:33:32 Multimodality (Vision, Audio)\n00:35:00 Thinking, System 1/2\n00:38:02 Self-improvement, LLM AlphaGo\n00:40:45 LLM Customization, GPTs store\n00:42:15 LLM OS\nPart 3: LLM Security\n00:45:43 LLM Security Intro\n00:46:14 Jailbreaks\n00:51:30 Prompt Injection\n00:56:23 Data poisoning\n00:58:37 LLM Security conclusions\nEnd\n00:59:23 Outro\n\nEducational Use Licensing\nThis video is freely available for educational and internal training purposes. Educators, students, schools, universities, nonprofit institutions, businesses, and individual learners may use this content freely for lessons, courses, internal training, and learning activities, provided they do not engage in commercial resale, redistribution, external commercial use, or modify content to misrepresent its intent.","isCrawlable":true,"thumbnail":{"thumbnails":[{"url":"https://i.ytimg.com/vi/zjkBMFhNj_g/default.jpg","width":120,"height":90},{"url":"https://i.ytimg.com/vi/zjkBMFhNj_g/mqdefault.jpg","width":320,"height":180},{"url":"https://i.ytimg.com/vi/zjkBMFhNj_g/hqdefault.jpg","width":480,"height":360},{"url":"https://i.ytimg.com/vi/zjkBMFhNj_g/sddefault.jpg","width":640,"height":480},{"url":"https://i.ytimg.com/vi/zjkBMFhNj_g/hq720.jpg?sqp=-oaymwEhCK4FEIIDSFryq4qpAxMIARUAAAAAGAElAADIQj0AgKJD\u0026rs=AOn4CLBGrZlDwvgJ5iPTzpzVOb-5wpcEzQ","width":686,"height":386}]},"allowRatings":true,"viewCount":"4233318","author":"Andrej Karpathy","isPrivate":false,"isUnpluggedCorpus":false,"isLiveContent":false,"isTvfilmVideo":false},"playerConfig":{ ecurity-related challenges of this new computing paradigm.\nAs of November 2023 (this field moves fast!).\n\nContext: This video is based on the slides of a talk I gave recently at the AI Security Summit. The talk was not recorded but a lot of people came to me after and told me they liked it. Seeing as I had already put in one long weekend of work to make the slides, I decided to just tune them a bit, record this round 2 of the talk and upload it here on YouTube. Pardon the random background, that's my hotel room during the thanksgiving break.\n\n- Slides as PDF: https://drive.google.com/file/d/1pxx_ZI7O-Nwl7ZLNk5hI3WzAsTLwvNU7/view?usp=share_link (42MB)\n- Slides. as Keynote: https://drive.google.com/file/d/1FPUpFMiCkMRKPFjhi9MAhby68MHVqe8u/view?usp=share_link (140MB)\n\nFew things I wish I said (I'll add items here as they come up):\n- The dreams and hallucinations do not get fixed with finetuning. Finetuning just \"directs\" the dreams into \"helpful assistant dreams\". Always be careful with what LLMs tell you, especially if they are telling you something from memory alone. That said, similar to a human, if the LLM used browsing or retrieval and the answer made its way into the \"working memory\" of its context window, you can trust the LLM a bit more to process that information into the final answer. But TLDR right now, do not trust what LLMs say or do. For example, in the tools section, I'd always recommend double-checking the math/code the LLM did.\n- How does the LLM use a tool like the browser? It emits special words, e.g. |BROWSER|. When the code \"above\" that is inferencing the LLM detects these words it captures the output that follows, sends it off to a tool, comes back with the result and continues the generation. How does the LLM know to emit these special words? Finetuning datasets teach it how and when to browse, by example. And/or the instructions for tool use can also be automatically placed in the context window (in the “system message”).\n- You might also enjoy my 2015 blog post \"Unreasonable Effectiveness of Recurrent Neural Networks\". The way we obtain base models today is pretty much identical on a high level, except the RNN is swapped for a Transformer. http://karpathy.github.io/2015/05/21/rnn-effectiveness/\n- What is in the run.c file? A bit more full-featured 1000-line version hre: https://github.com/karpathy/llama2.c/blob/master/run.c\n\nChapters:\nPart 1: LLMs\n00:00:00 Intro: Large Language Model (LLM) talk\n00:00:20 LLM Inference\n00:04:17 LLM Training\n00:08:58 LLM dreams\n00:11:22 How do they work?\n00:14:14 Finetuning into an Assistant\n00:17:52 Summary so far\n00:21:05 Appendix: Comparisons, Labeling docs, RLHF, Synthetic data, Leaderboard\nPart 2: Future of LLMs\n00:25:43 LLM Scaling Laws\n00:27:43 Tool Use (Browser, Calculator, Interpreter, DALL-E)\n00:33:32 Multimodality (Vision, Audio)\n00:35:00 Thinking, System 1/2\n00:38:02 Self-improvement, LLM AlphaGo\n00:40:45 LLM Customization, GPTs store\n00:42:15 LLM OS\nPart 3: LLM Security\n00:45:43 LLM Security Intro\n00:46:14 Jailbreaks\n00:51:30 Prompt Injection\n00:56:23 Data poisoning\n00:58:37 LLM Security conclusions\nEnd\n00:59:23 Outro\n\nEducational Use Licensing\nThis video is freely available for educational and internal training purposes. Educators, students, schools, universities, nonprofit institutions, businesses, and individual learners may use this content freely for lessons, courses, internal training, and learning activities, provided they do not engage in commercial resale, redistribution, external commercial use, or modify content to misrepresent its intent."}]},"lengthSeconds":"3588","ownerProfileUrl":"http://www.youtube.com/@AndrejKarpathy","externalChannelId":"UCXUPKJO5MZQN11PqgIvyuvQ","isFamilySafe":true,"availableCountries":["AD","AE","AF","AG","AI","AL","AM","AO","AQ","AR","AS","AT","AU","AW","AX","AZ","BA","BB","BD","BE","BF","BG","BH","BI","BJ","BL","BM","BN","BO","BQ","BR","BS","BT","BV","BW","BY","BZ","CA","C
